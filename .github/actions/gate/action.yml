name: gate
description: The full suite — install, lint, format check, audit, typecheck, unit and mod engine tests, manifest validation, version-pin check, skill lint. Assumes the repo is already checked out.
runs:
  using: composite
  steps:
    - name: Enable Corepack
      # Node 26 distributions no longer bundle corepack.
      run: |
        npm install -g corepack
        corepack enable
      shell: bash
    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: '26'
        cache: yarn
        cache-dependency-path: yarn.lock
    - name: Install dependencies
      run: yarn install --immutable
      shell: bash
    - name: Lint
      run: yarn lint
      shell: bash
    - name: Check formatting
      run: yarn format:check
      shell: bash
    - name: Audit dependencies
      run: yarn npm audit
      shell: bash
    - name: Typecheck
      run: yarn typecheck
      shell: bash
    - name: Unit tests
      run: yarn test
      shell: bash
    - name: Install Claude Code CLI
      run: npm install -g @anthropic-ai/claude-code
      shell: bash
    - name: Mod engine tests
      run: yarn test:mods
      shell: bash
    - name: Validate plugin + marketplace manifests
      run: |
        claude plugin validate --strict .claude-plugin/marketplace.json
        for m in packages/*/.claude-plugin/plugin.json; do
          claude plugin validate --strict "$m"
        done
      shell: bash
    - name: Check package versions ride the repo version
      run: node .github/scripts/set-version.mjs --check
      shell: bash
    - name: Lint skills
      run: node .github/scripts/build-skills.mjs
      shell: bash
