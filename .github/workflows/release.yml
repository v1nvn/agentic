name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump the prepare job applies before publishing'
        type: choice
        options: [none, patch, minor, major]
        default: none

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' && inputs.bump != 'none'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Enable Corepack
        # Node 26 distributions no longer bundle corepack.
        run: |
          npm install -g corepack
          corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: yarn install --immutable
      - name: Bump the train version
        run: node .github/scripts/set-version.mjs --bump "${{ inputs.bump }}"
      - run: yarn build
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate plugin + marketplace manifests
        run: |
          claude plugin validate .claude-plugin/marketplace.json
          for m in packages/*/plugin/.claude-plugin/plugin.json packages/*/.claude-plugin/plugin.json; do
            claude plugin validate "$m"
          done
      - name: Check package versions ride the repo version
        run: node .github/scripts/set-version.mjs --check
      - name: Commit and push the bump
        id: push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "chore(release): v$(jq -r .version .claude-plugin/marketplace.json)"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  release:
    needs: [prepare]
    if: (!failure() && !cancelled())
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha || github.ref }}

      # Every package rides this version; build.yml enforces the mirrors agree.
      - name: Resolve release tag
        id: version
        run: echo "tag=v$(jq -r .version .claude-plugin/marketplace.json)" >> "$GITHUB_OUTPUT"

      - name: Skip if this version is already released
        id: check
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ steps.version.outputs.tag }} already exists; nothing to publish."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable Corepack
        if: steps.check.outputs.skip == 'false'
        # Node 26 distributions no longer bundle corepack.
        run: |
          npm install -g corepack
          corepack enable
      - uses: actions/setup-node@v7
        if: steps.check.outputs.skip == 'false'
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'
          cache: yarn
          cache-dependency-path: yarn.lock

      # Per-package skip makes re-runs safe: a version already on npm is never
      # republished, so a failed second half leaves a clean retry.
      - name: Build and publish packages to npm via trusted publishing
        if: steps.check.outputs.skip == 'false'
        run: |
          version="$(jq -r .version .claude-plugin/marketplace.json)"
          yarn install --immutable
          yarn build
          for pkg in packages/*; do
            # enhansome and todo are plugin-only homes — nothing to publish
            [ -f "$pkg/package.json" ] || continue
            name="$(jq -r .name "$pkg/package.json")"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "::notice::$name@$version already on npm; skipping."
            else
              (cd "$pkg" && yarn npm publish --provenance)
            fi
          done

      - name: Create GitHub Release
        if: steps.check.outputs.skip == 'false'
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd
        with:
          name: ${{ steps.version.outputs.tag }}
          tag: ${{ steps.version.outputs.tag }}
          commit: ${{ needs.prepare.outputs.sha || github.sha }}
          generateReleaseNotes: true
          skipIfReleaseExists: true
