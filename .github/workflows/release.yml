name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump the prepare job applies before publishing'
        type: choice
        options: [none, patch, minor, major]
        default: none

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' && inputs.bump != 'none'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Enable Corepack
        # Node 26 distributions no longer bundle corepack.
        run: |
          npm install -g corepack
          corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: yarn install --immutable
      - name: Bump the train version
        run: node .github/scripts/set-version.mjs --bump "${{ inputs.bump }}" --no-locks
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate plugin + marketplace manifests
        run: |
          claude plugin validate .claude-plugin/marketplace.json
          for m in packages/*/.claude-plugin/plugin.json; do
            claude plugin validate "$m"
          done

      # The lockfiles pin the train's own core version with its registry
      # integrity hash, so core must be on npm before they regenerate — the
      # release job's per-package skip then publishes only the remaining homes.
      - name: Publish core at the new version
        run: |
          version="$(jq -r .version .claude-plugin/marketplace.json)"
          if npm view "@v1nvn/agentic-core@$version" version >/dev/null 2>&1; then
            echo "::notice::@v1nvn/agentic-core@$version already on npm; skipping."
          else
            node .github/scripts/publish-face.mjs packages/core
            (cd packages/core && yarn npm publish --provenance)
            node .github/scripts/publish-face.mjs --revert packages/core
          fi
      # Post-publish visibility is asynchronous on the registry's side: the
      # per-version URL answers within seconds while the packument route npm
      # resolves through has served pre-publish state for minutes past the
      # publish, whatever the client cache does. The poll therefore uses npm
      # itself — npm view fetches the same packument URL the lock regen
      # resolves against.
      - name: Wait for the published core to resolve on the registry
        run: |
          version="$(jq -r .version .claude-plugin/marketplace.json)"
          for attempt in $(seq 1 60); do
            npm view "@v1nvn/agentic-core@$version" version --prefer-online >/dev/null 2>&1 && exit 0
            echo "@v1nvn/agentic-core@$version not resolvable on npm yet (attempt ${attempt}/60); retrying in 10s"
            sleep 10
          done
          echo "::error::@v1nvn/agentic-core@$version never resolved on the registry"
          exit 1

      - name: Regenerate lockfiles against the published core
        run: node .github/scripts/set-version.mjs "$(jq -r .version .claude-plugin/marketplace.json)"
      - name: Check package versions ride the repo version
        run: node .github/scripts/set-version.mjs --check
      - name: Commit and push the bump
        id: push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "chore(release): v$(jq -r .version .claude-plugin/marketplace.json)"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  release:
    needs: [prepare]
    if: (!failure() && !cancelled())
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha || github.ref }}

      # Every package rides this version; build.yml enforces the mirrors agree.
      - name: Resolve release tag
        id: version
        run: echo "tag=v$(jq -r .version .claude-plugin/marketplace.json)" >> "$GITHUB_OUTPUT"

      - name: Skip if this version is already released
        id: check
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ steps.version.outputs.tag }} already exists; nothing to publish."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable Corepack
        if: steps.check.outputs.skip == 'false'
        # Node 26 distributions no longer bundle corepack.
        run: |
          npm install -g corepack
          corepack enable
      - uses: actions/setup-node@v7
        if: steps.check.outputs.skip == 'false'
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'
          cache: yarn
          cache-dependency-path: yarn.lock

      # Per-package skip makes re-runs safe: a version already on npm is never
      # republished, so a failed second half leaves a clean retry.
      - name: Build and publish packages to npm via trusted publishing
        if: steps.check.outputs.skip == 'false'
        run: |
          version="$(jq -r .version .claude-plugin/marketplace.json)"
          yarn install --immutable
          for pkg in packages/*; do
            # enhansome and todo are plugin-only homes — nothing to publish
            [ -f "$pkg/package.json" ] || continue
            name="$(jq -r .name "$pkg/package.json")"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "::notice::$name@$version already on npm; skipping."
            else
              # Node will not type-strip .ts under node_modules — the registry
              # face is compiled .js, the git/plugin face stays .ts source.
              node .github/scripts/publish-face.mjs "$pkg"
              (cd "$pkg" && yarn npm publish --provenance)
            fi
          done

      - name: Create GitHub Release
        if: steps.check.outputs.skip == 'false'
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd
        with:
          name: ${{ steps.version.outputs.tag }}
          tag: ${{ steps.version.outputs.tag }}
          commit: ${{ needs.prepare.outputs.sha || github.sha }}
          generateReleaseNotes: true
          skipIfReleaseExists: true
