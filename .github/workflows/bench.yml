name: bench

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/readability-mcp
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      # Node 26 distributions no longer bundle corepack.
      - run: |
          npm install -g corepack
          corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: yarn install --immutable
      # The bench runs vite-node against src, which imports @v1nvn/agentic-core
      # through the workspace link — its dist must exist before benching.
      - run: yarn workspace @v1nvn/agentic-core build
      - run: yarn bench
