name: readability-versions

on:
  workflow_dispatch:
    inputs:
      from_version:
        description: Readability version to snapshot as the baseline
        default: '0.6.0'
      to_version:
        description: Readability version to compare against the baseline
        default: 'latest'
  schedule:
    # Monday 06:17 UTC — drift check against the latest published version.
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  diff:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/readability
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Node 26 distributions no longer bundle corepack.
      - run: |
          npm install -g corepack
          corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: yarn install --immutable
      # version-snapshot imports the tool graph, which resolves
      # @v1nvn/agentic-core through the workspace link — build its dist first.
      - run: yarn workspace @v1nvn/agentic-core build

      - name: Snapshot baseline version
        run: |
          yarn add "@mozilla/readability@${{ inputs.from_version || '0.6.0' }}"
          echo "FROM_VERSION=$(yarn node -p "require('@mozilla/readability/package.json').version")" >> "$GITHUB_ENV"
          yarn exec vite-node test/bench/version-snapshot.ts --out snapshot-from

      - name: Snapshot comparison version
        run: |
          yarn add "@mozilla/readability@${{ inputs.to_version || 'latest' }}"
          echo "TO_VERSION=$(yarn node -p "require('@mozilla/readability/package.json').version")" >> "$GITHUB_ENV"
          yarn exec vite-node test/bench/version-snapshot.ts --out snapshot-to

      # `git diff --no-index` exits 1 whenever the trees differ, which is the
      # whole point of this job — swallow that exit so the step is green.
      - name: Diff snapshots
        run: |
          git diff --no-index --stat snapshot-from snapshot-to > diff-stat.txt || true
          git diff --no-index snapshot-from snapshot-to > diff-full.txt || true

      - name: Summary
        run: |
          {
            echo '## Readability version differential'
            echo ''
            echo "Baseline: \`$FROM_VERSION\` → Comparison: \`$TO_VERSION\`"
            echo ''
            echo '### Per-fixture changes'
            echo ''
            echo '```diff'
            cat diff-stat.txt
            echo '```'
            echo ''
            echo 'Full per-fixture diff is in the `readability-diff` workflow artifact (`diff-full.txt`).'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: readability-diff
          path: |
            snapshot-from/
            snapshot-to/
            diff-stat.txt
            diff-full.txt
