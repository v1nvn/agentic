name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate plugin + marketplace manifests
        run: |
          claude plugin validate .claude-plugin/marketplace.json
          for p in readability omlx rm md zai tokens; do
            claude plugin validate "plugins/$p/.claude-plugin/plugin.json"
          done
      - name: Check package versions ride the repo version
        run: node .github/scripts/set-version.mjs --check
      - name: Lint skills
        run: node .github/scripts/build-skills.mjs
