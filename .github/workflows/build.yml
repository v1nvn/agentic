name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate plugin + marketplace manifests
        run: |
          claude plugin validate .claude-plugin/marketplace.json
          for p in readability omlx rm md zai tokens; do
            claude plugin validate "plugins/$p/.claude-plugin/plugin.json"
          done
      - name: Check package versions ride the repo version
        run: |
          set -euo pipefail
          repo="$(jq -r .version .claude-plugin/marketplace.json)"
          for f in readability-mcp/package.json omlx-mcp/package.json \
                   plugins/readability/.claude-plugin/plugin.json \
                   plugins/omlx/.claude-plugin/plugin.json; do
            v="$(jq -r .version "$f")"
            if [ "$v" != "$repo" ]; then
              echo "::error::$f version $v does not ride the repo version $repo"
              exit 1
            fi
          done
      - name: Check shared scripts stay in sync
        run: |
          set -euo pipefail
          shopt -s nullglob
          status=0
          check() {
            for copy in $1; do
              if ! cmp -s "$2" "$copy"; then
                echo "::error::$copy differs from $2 — re-sync from the shared source"
                status=1
              fi
            done
          }
          check 'plugins/*/bin/last-reply' shared/bin/last-reply
          check 'plugins/*/bin/text-format.mjs' shared/bin/text-format.mjs
          exit "$status"
      - name: Lint skills
        run: node .github/scripts/build-skills.mjs
