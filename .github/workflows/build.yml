name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate plugin + marketplace manifests
        run: |
          claude plugin validate .claude-plugin/marketplace.json
          for m in plugins/*/.claude-plugin/plugin.json; do
            claude plugin validate "$m"
          done
      - name: Check package versions ride the repo version
        run: node .github/scripts/set-version.mjs --check
      - name: Lint skills
        run: node .github/scripts/build-skills.mjs
