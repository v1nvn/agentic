name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Node 26 distributions no longer bundle corepack.
      - run: |
          npm install -g corepack
          corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: yarn install --immutable
      - run: yarn typecheck
      - run: yarn build
      - run: yarn test
